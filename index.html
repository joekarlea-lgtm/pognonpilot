<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="PognonPILOT, gestion de finances personnelles : comptes, opérations, virements, catégories et rapports.">
<meta name="theme-color" content="#2450E6">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>PognonPILOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout : rail latéral sur PC, barre d'onglets en bas sur mobile ; registre façon carnet de compte */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#EEF1F7; --fg:#0E1525; --muted:#5B6478; --line:#E4E8F0;
  --accent:#2450E6; --accent-ink:#FFFFFF; --accent-soft:#EAF0FF;
  --pos:#0F8A5F; --neg:#C2412D; --warn:#9A6200; --rev:#14A37F; --dep:#F07A5A;
  --hero:#0E1525; --hero-fg:#FFFFFF; --hero-mut:#A9B3C7; --hero-line:#8EA4FF; --hero-pill:#163D2F; --hero-pill-fg:#6EE7B7;
  --t0b:#EAF0FF; --t0f:#2450E6; --t1b:#FDEDE8; --t1f:#B93B22; --t2b:#E3F7EE; --t2f:#0B7A52; --t3b:#F3ECFF; --t3f:#6B3FD1;
  --t4b:#FFF4D6; --t4f:#8A5A00; --t5b:#E2F4F8; --t5f:#11697C; --t6b:#FCE7F0; --t6f:#A8295F; --t7b:#EEF1F5; --t7f:#4A5568;
  --c0:#2450E6; --c1:#F07A5A; --c2:#8B5CF6; --c3:#E7B416; --c4:#14A37F; --c5:#C5CBD8;
  --display:"Onest", "Segoe UI", system-ui, sans-serif;
  --body:"Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0E18; --surface:#121A2A; --surface-2:#1A2337; --fg:#E8ECF5; --muted:#97A3BA; --line:#232D42;
  --accent:#7B96FF; --accent-ink:#0A1230; --accent-soft:#1C2647;
  --pos:#4ADE9B; --neg:#F59382; --warn:#E5B65B; --rev:#34C796; --dep:#F59382;
  --hero:#1A2440; --hero-fg:#FFFFFF; --hero-mut:#B3BDD3; --hero-line:#9DB0FF; --hero-pill:#173D31; --hero-pill-fg:#7CF0C0;
  --t0b:#1C2647; --t0f:#9DB0FF; --t1b:#3A2019; --t1f:#FFA48C; --t2b:#13332A; --t2f:#6EE7B7; --t3b:#2A2045; --t3f:#C4A8FF;
  --t4b:#352A10; --t4f:#F4CD62; --t5b:#12313A; --t5f:#7DD8EA; --t6b:#3A1828; --t6f:#F59CC2; --t7b:#1F2738; --t7f:#B3BDD3;
  --c0:#7B96FF; --c1:#F59382; --c2:#B48CFF; --c3:#F4CD62; --c4:#34C796; --c5:#4A556C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E18; --surface:#121A2A; --surface-2:#1A2337; --fg:#E8ECF5; --muted:#97A3BA; --line:#232D42;
  --accent:#7B96FF; --accent-ink:#0A1230; --accent-soft:#1C2647;
  --pos:#4ADE9B; --neg:#F59382; --warn:#E5B65B; --rev:#34C796; --dep:#F59382;
  --hero:#1A2440; --hero-fg:#FFFFFF; --hero-mut:#B3BDD3; --hero-line:#9DB0FF; --hero-pill:#173D31; --hero-pill-fg:#7CF0C0;
  --t0b:#1C2647; --t0f:#9DB0FF; --t1b:#3A2019; --t1f:#FFA48C; --t2b:#13332A; --t2f:#6EE7B7; --t3b:#2A2045; --t3f:#C4A8FF;
  --t4b:#352A10; --t4f:#F4CD62; --t5b:#12313A; --t5f:#7DD8EA; --t6b:#3A1828; --t6f:#F59CC2; --t7b:#1F2738; --t7f:#B3BDD3;
  --c0:#7B96FF; --c1:#F59382; --c2:#B48CFF; --c3:#F4CD62; --c4:#34C796; --c5:#4A556C; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:24px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;padding:0 10px 18px;display:flex;align-items:center;gap:8px}
.brand i{width:32px;height:32px;border-radius:10px;font-weight:800;background:var(--accent);display:inline-grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:15px}
.nav{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--muted);font-weight:500}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{background:var(--surface-2);color:var(--fg)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.nav[aria-current="page"] svg{color:var(--accent)}
.nav:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rail .grow{flex:1}
.savechip{font-size:12.5px;color:var(--muted);padding:12px 14px 12px 30px;border-radius:14px;background:var(--surface-2);position:relative}
.savechip::before{content:"";position:absolute;left:13px;top:17px;width:8px;height:8px;border-radius:50%;background:var(--pos)}
.savechip.dirty::before{background:var(--warn)}
.savechip b{display:block;color:var(--fg);font-weight:600}
.savechip.dirty b{color:var(--warn)}
main{padding-block:28px 96px;padding-inline:clamp(16px,4vw,44px);min-width:0;max-width:1180px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,3.4vw,34px);letter-spacing:-.025em;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;margin:0 0 12px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 18px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--neg)}
.btn.small{padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:var(--r);background:var(--accent-soft);margin-bottom:22px;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 24px;min-width:0}
.grid{display:grid;gap:16px}
.g-dash{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.hero{padding:6px 0 26px}
.hero .big{font-family:var(--display);font-size:clamp(40px,7vw,64px);font-weight:700;letter-spacing:-.035em;line-height:1}
.hero .sub{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;color:var(--muted)}
.hero .sub b{color:var(--fg);font-weight:600}
.acclist{display:flex;flex-direction:column}
.accrow{all:unset;cursor:pointer;display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.accrow:last-child{border-bottom:0}
.typehead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:14px 4px 4px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
.typehead:first-of-type{padding-top:0}
.accrow:hover .an{color:var(--accent)}
.dot{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;font-size:15px}
.an{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.at{font-size:12.5px;color:var(--muted)}
.amt{font-weight:600;text-align:right}
.neg{color:var(--neg)} .pos{color:var(--pos)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.chart svg{width:100%;height:auto;display:block}
.catbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:8px 0}
.catbar .track{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.catbar .fill{height:100%;background:var(--dep);border-radius:99px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.toolbar .inp{width:auto}
.search{flex:1;min-width:160px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.tab{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;font-weight:500;font-size:14px;background:var(--surface)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.regsum{display:flex;flex-wrap:wrap;gap:12px 28px;margin-bottom:16px}
.regsum div{display:flex;flex-direction:column}
.regsum b{font-family:var(--display);font-size:22px;letter-spacing:-.02em}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:680px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
th.r,td.r{text-align:right}
.payee{font-weight:600}
.cat{font-size:13px;color:var(--muted)}
.chip{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;font-size:12px;font-weight:700;border:1px dashed var(--line);color:var(--muted)}
.chip.P{border:1px solid var(--warn);color:var(--warn)}
.chip.R{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent)}
.xfer{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);margin-left:6px;vertical-align:1px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.g-cats{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.cathead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.cathead h3{margin:0;font-size:16px;font-family:var(--display);font-weight:600}
.kind{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.03em}
.kind.dep{background:color-mix(in srgb,var(--dep) 22%,transparent);color:var(--fg)}
.kind.rev{background:var(--accent-soft);color:var(--fg)}
.subs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.sub{display:inline-flex;align-items:center;gap:4px;padding:5px 6px 5px 11px;border-radius:999px;background:var(--surface-2);font-size:13.5px}
.x{all:unset;cursor:pointer;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:15px;line-height:1}
.x:hover{background:var(--line);color:var(--neg)}
.addsub{display:flex;gap:6px}
.addsub .inp{padding:7px 10px;font-size:14px}
.g-file{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.panel p{margin:0 0 14px;color:var(--muted);max-width:62ch}
.row{display:flex;flex-wrap:wrap;gap:8px}
.soon{border-style:dashed}
/* bottom sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(8,14,12,.45);display:grid;place-items:center;padding:16px;z-index:40}
.sheet{background:var(--surface);border-radius:20px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.sheet h2{font-size:21px;margin-bottom:16px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;margin-bottom:16px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:9px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
.amountinp{font-family:var(--display);font-size:28px;font-weight:700;padding:10px 14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:20px}
.actions .row{margin-left:auto}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{all:unset;cursor:pointer;width:28px;height:28px;border-radius:9px;border:2px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.preview{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px}
.preview table{min-width:420px;font-size:13px}
.preview td,.preview th{padding:7px 10px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:500;z-index:60;max-width:calc(100% - 32px)}
.fab{display:none}
.lede{color:var(--muted);margin:-8px 0 18px;max-width:68ch}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:16px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.02em}
.delta{font-size:12.5px;color:var(--muted)} .delta.good{color:var(--pos)} .delta.bad{color:var(--neg)}
table.rep{min-width:560px}
tfoot td{font-weight:700;background:var(--surface-2);border-bottom:0}
.share{display:flex;align-items:center;gap:8px}
.sharebar{flex:1;height:6px;border-radius:9px;background:var(--surface-2);min-width:60px}
.sharebar i{display:block;height:100%;background:var(--dep);border-radius:9px}
.picker{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.pickhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.pickhead .row{gap:14px}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--muted)}
.pick[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.pick .sq{width:10px;height:10px;border-radius:3px}
.pick:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters+.picker,.picker+.kpis{margin-top:0}
.picker:last-of-type{margin-bottom:16px}
.evohead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.evohead h2{margin:0 0 2px}
.evoctl{display:flex;flex-wrap:wrap;gap:8px}
.evoctl .inp{width:auto;padding:7px 10px;font-size:14px;max-width:100%}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:30;gap:0}
  .brand,.rail .grow,.savechip{display:none}
  .nav{flex-direction:column;gap:3px;font-size:11.5px;padding:7px 4px;flex:1;align-items:center}
  .g-dash{grid-template-columns:minmax(0,1fr)}
  .head .btn.primary{display:none}
  .fab{display:inline-flex;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);border:0;font-size:28px;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,0,0,.25);cursor:pointer}
  .scrim{place-items:end center;padding:0}
  .sheet{border-radius:22px 22px 0 0;width:100%;max-height:92%;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  .form{grid-template-columns:1fr}
  /* registre en cartes */
  table.reg{min-width:0}
  table.reg thead{display:none}
  table.reg tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
  table.reg td{padding:0;border:0}
  table.reg td.d{grid-column:2;grid-row:2;font-size:12.5px;color:var(--muted)}
  table.reg td.p{grid-column:2;grid-row:1;min-width:0}
  table.reg td.s{grid-column:1;grid-row:1/3;align-self:center}
  table.reg td.m{grid-column:3;grid-row:1}
  table.reg td.md{display:none}
  table.reg td.m .mdm{display:block;margin-top:4px}table.reg td.m .mdm .mtag{margin:0}
  table.reg td.b{grid-column:3;grid-row:2;font-size:12.5px;color:var(--muted)}
  .regwrap{border-radius:var(--r)}
}

/* --- direction A : accueil, icônes de catégories, registre par jour --- */
.ico{width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;flex:none}
.ico svg{width:19px;height:19px}
.ico.sm{width:32px;height:32px;border-radius:10px}.ico.sm svg{width:16px;height:16px}
.ico.lg{width:46px;height:46px;border-radius:14px}.ico.lg svg{width:22px;height:22px}
.t0{background:var(--t0b);color:var(--t0f)}.t1{background:var(--t1b);color:var(--t1f)}.t2{background:var(--t2b);color:var(--t2f)}.t3{background:var(--t3b);color:var(--t3f)}
.t4{background:var(--t4b);color:var(--t4f)}.t5{background:var(--t5b);color:var(--t5f)}.t6{background:var(--t6b);color:var(--t6f)}.t7{background:var(--t7b);color:var(--t7f)}
.dgrid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:18px}
.herocard{grid-column:span 2;min-width:0;padding:26px 28px;border-radius:24px;background:var(--hero);color:var(--hero-fg);display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-end}
.herocard .lab{font-size:13px;color:var(--hero-mut);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.herocard .big{font-family:var(--display);font-size:clamp(36px,5.4vw,52px);font-weight:800;letter-spacing:-.04em;line-height:1;margin:8px 0 10px}
.herocard .pill{padding:4px 10px;border-radius:99px;background:var(--hero-pill);color:var(--hero-pill-fg);font-weight:600}
.herocard .pill.down{background:#3D1E19;color:#FFB4A3}
.herocard svg{max-width:100%;height:auto}
.mcard{display:flex;flex-direction:column;gap:12px}

<script>
"use strict";
const KEY="pognonpilot.v1";
const TYPES=["Courant","Épargne","Placements","Collection"];
const TYPE_HINT={"Courant":"Comptes de tous les jours et cartes","Épargne":"Livrets et comptes d'épargne","Placements":"Assurance-vie, PEA, titres","Collection":"Valeur des objets de collection"};
const OLD_TYPES={"Compte courant":"Courant","Carte de crédit":"Courant","Espèces":"Courant","Prêt":"Courant","Livret / Épargne":"Épargne","Placement":"Placements"};
function migrate(d){if(!d.mig40){d.mig40=1;
  d.accounts.forEach(a=>{if(["AMAZON","PAYPAL","POULPEO"].includes(String(a.name).trim().toUpperCase())&&a.block==null)a.block="Portefeuilles en ligne"});
  const rp=v=>typeof v==="string"?v.replace(/PSA Banque/gi,"DISTINGO Bank"):v;
  d.accounts.forEach(a=>{a.name=rp(a.name);a.bank=rp(a.bank)});(d.payees||[]).forEach(p=>p.name=rp(p.name));
  if(d.payees){const seen=new Set();d.payees=d.payees.filter(p=>{const k=String(p.name).toLowerCase();if(seen.has(k))return false;seen.add(k);return true})}
  d.tx.forEach(t=>{t.payee=rp(t.payee);t.note=rp(t.note);if(t.doubt)t.doubt=rp(t.doubt)});(d.recurring||[]).forEach(r=>{r.payee=rp(r.payee);r.label=rp(r.label);r.note=rp(r.note)})}
  if(!d.logos||typeof d.logos!=="object")d.logos={};d.tx.forEach(t=>{if(t.note)t.note=normNote(t.note)});(d.recurring||[]).forEach(r=>{if(r.note)r.note=normNote(r.note)});d.accounts.forEach(a=>{if(!TYPES.includes(a.type))a.type=OLD_TYPES[a.type]||"Courant"});d.tx.forEach(t=>{if(t.status!=="R")t.status=""});d.categories.forEach(c=>delete c.kind);ensureIcons(d);if(!Array.isArray(d.recurring))d.recurring=[];return d}
const COLORS=["#0B6E5A","#2F5DA8","#C0632F","#7A4FA0","#A3842A","#3E7F94","#B04A6B","#5B6770"];
const eur=new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"});
const fmt=n=>eur.format((Math.round(n*100)/100)||0);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today=()=>iso(new Date());
const r2=n=>Math.round(n*100)/100;
const fdate=iso=>{const [y,m,d]=iso.split("-");return `${d}/${m}/${y}`};
const MONTHS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];

let showClosed=false,regF="all",regLim=400,regLimKey="",regIds=[];
let S, view="dash", regAcc="all", regQ="", dirty=false, lastSaved=null, fileHandle=null;

/* ---------- données d'exemple ---------- */
function sample(){
  const acc=[
    {id:"a1",name:"Compte courant",type:"Courant",initial:1240,color:COLORS[0]},
    {id:"a3",name:"Carte différée",type:"Courant",initial:0,color:COLORS[2]},
    {id:"a2",name:"Livret A",type:"Épargne",initial:6500,color:COLORS[1]},
    {id:"a5",name:"Assurance-vie",type:"Placements",initial:12000,color:COLORS[3]},
    {id:"a6",name:"Ma collection",type:"Collection",initial:1850,color:COLORS[6]}];
  ["2014-09-01","2019-03-15","2011-06-20","2017-01-10","2020-05-02"].forEach((d,i)=>acc[i].opened=d);
  const C=(name,subs)=>({id:uid(),name,subs:subs.map(n=>({id:uid(),name:n}))});
  const cats=[C("Alimentation",["Courses","Restaurants","Boulangerie"]),C("Logement",["Loyer","Énergie","Assurance habitation","Internet"]),
    C("Transport",["Carburant","Péage","Entretien"]),C("Loisirs",["Sorties","Abonnements","Voyages"]),
    C("Santé",["Médecin","Pharmacie"]),C("Revenus",["Salaire","Primes","Intérêts"])];
  const f=(c,s)=>{const k=cats.find(x=>x.name===c);return{catId:k.id,subId:k.subs.find(x=>x.name===s).id}};
  const tx=[];let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  const now=new Date();
  for(let m=5;m>=0;m--){
    const y=now.getFullYear(),mo=now.getMonth()-m;
    const d=(day)=>iso(new Date(y,mo,Math.min(day,28)));
    const add=(a,day,payee,amount,cs)=>{const dt=d(day);if(dt>today())return;tx.push({id:uid(),accountId:a,date:dt,payee,amount,...cs,status:m>=1?"R":"",note:""})};
    add("a1",1,"Employeur — salaire",2480,f("Revenus","Salaire"));
    add("a1",5,"Foncia — loyer",-780,f("Logement","Loyer"));
    add("a1",9,"EDF",-86.4,f("Logement","Énergie"));
    add("a1",12,"Box internet",-34.99,f("Logement","Internet"));
    add("a1",3,"Streaming vidéo",-13.49,f("Loisirs","Abonnements"));
    for(let i=0;i<4;i++)add("a1",4+i*7,["Carrefour","Intermarché","Biocoop","Lidl"][i],-(48+rnd()*70),f("Alimentation","Courses"));
    add("a3",14,"Station Total",-(55+rnd()*25),f("Transport","Carburant"));
    add("a3",18,"Le Bistrot du Marché",-(32+rnd()*40),f("Alimentation","Restaurants"));
    add("a3",22,["Cinéma","Concert","Bowling"][m%3],-(18+rnd()*30),f("Loisirs","Sorties"));
    if(m%2===0)add("a1",16,"Pharmacie centrale",-(9+rnd()*20),f("Santé","Pharmacie"));
    if(m%2===1){add("a1",15,"Dr Martin — consultation",-30,f("Santé","Médecin"));add("a1",21,"CPAM — remboursement",21,f("Santé","Médecin"))}
    add("a1",10,"Boulangerie",-(12+rnd()*8),f("Alimentation","Boulangerie"));
    const xd=d(2);if(xd<=today()){const t=uid();
      tx.push({id:uid(),accountId:"a1",date:xd,payee:"Virement vers Livret A",amount:-200,transferId:t,status:m>=1?"R":"",note:""});
      tx.push({id:uid(),accountId:"a2",date:xd,payee:"Virement depuis Compte courant",amount:200,transferId:t,status:m>=1?"R":"",note:""});}
  }
  return{version:1,sample:true,sv:5,accounts:acc,categories:cats,tx};
}
const PP_CATS=[{"id":"g0","name":"Alimentation","subs":[{"id":"g0_0","name":"Courses"},{"id":"g0_1","name":"Restaurant"}]},{"id":"g1","name":"Logement","subs":[{"id":"g1_0","name":"Loyer"},{"id":"g1_1","name":"Énergie"},{"id":"g1_2","name":"Assurance"}]},{"id":"g2","name":"Transport","subs":[{"id":"g2_0","name":"Carburant"},{"id":"g2_1","name":"Entretien"}]},{"id":"g3","name":"Loisirs","subs":[{"id":"g3_0","name":"Sorties"},{"id":"g3_1","name":"Abonnements"}]},{"id":"g4","name":"Santé","subs":[{"id":"g4_0","name":"Médecin"},{"id":"g4_1","name":"Pharmacie"}]},{"id":"g5","name":"Revenus","subs":[{"id":"g5_0","name":"Salaire"},{"id":"g5_1","name":"Intérêts"}]}];
const PP_ACCS=[];
const PP_PAYEES=[];
const clone=o=>JSON.parse(JSON.stringify(o));
function fresh(){return ensureIcons({version:1,sample:false,init:"pp31",accounts:clone(PP_ACCS),categories:clone(PP_CATS),payees:clone(PP_PAYEES),recurring:[],tx:[]})}
function upgrade(d){if(d.init==="pp30"){const names=new Set(d.accounts.map(a=>a.name));clone(PP_ACCS).forEach(a=>{if(!names.has(a.name))d.accounts.push(a)});d.payees=d.payees&&d.payees.length?d.payees:clone(PP_PAYEES);d.init="pp31"}if(!d.payees)d.payees=[];return d}
function blank(){const s=sample();return{version:1,sample:false,accounts:[{id:uid(),name:"Compte courant",type:"Courant",initial:0,color:COLORS[0]}],categories:s.categories,tx:[]}}

/* ---------- stockage ---------- */
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);S=migrate(o.data);if(S.sample||!/^pp3/.test(S.init||""))S=fresh();else S=upgrade(S);dirty=!!o.dirty;lastSaved=o.lastSaved||null;return}}catch(e){}S=fresh();cache()}
function cache(){try{localStorage.setItem(KEY,JSON.stringify({data:S,dirty,lastSaved}))}catch(e){}}
function commit(){dirty=true;cache();render();scheduleAutoSave()}

/* ---------- calculs ---------- */
const active=()=>S.accounts.filter(a=>!a.closed);
const defaultAcc=()=>{const l=active();const c=l.filter(a=>a.type==="Courant");return(c.find(a=>/C\.C\.P|COURANT/i.test(a.name))||c[0]||l[0]||S.accounts[0])?.id};
const accById=id=>S.accounts.find(a=>a.id===id);
const catLabel=t=>{if(t.transferId)return"Virement";if(isSplit(t))return`Ventilée sur ${t.splits.length} catégories`;const c=S.categories.find(c=>c.id===t.catId);if(!c)return"Non catégorisé";const s=c.subs.find(s=>s.id===t.subId);return s?`${c.name} › ${s.name}`:c.name};
const payeeNames=()=>[...new Set([...(S.payees||[]).filter(p=>p.active).map(p=>p.name),...S.tx.filter(t=>!t.transferId).map(t=>t.payee)])].sort((a,b)=>a.localeCompare(b,"fr"));

/* ventilation : une opération peut porter plusieurs parts {catId,subId,amount,note} dont la somme = montant */
const normNote=v=>String(v||"").replace(/\r/g,"").split(/\n|►/).map(x=>x.trim().replace(/\s*\+$/,"").trim()).filter(Boolean).join("\n");
const isSplit=t=>!!(t&&t.splits&&t.splits.length>1);
const expandSplits=list=>list.flatMap(t=>isSplit(t)?t.splits.map((p,i)=>({...t,id:t.id+"#"+i,catId:p.catId,subId:p.subId,amount:p.amount,note:p.note||t.note,splits:null,_part:i+1,_of:t.splits.length})):[t]);
const partLabel=p=>catLabel({catId:p.catId,subId:p.subId});
const splitSummary=t=>t.splits.map(p=>`${partLabel(p)} ${fmt(Math.abs(p.amount))}`).join(" · ");
const catName=t=>S.categories.find(c=>c.id===t.catId)?.name||"Non catégorisé";
/* Revenus / dépenses nets : les opérations d'une même catégorie se compensent (un remboursement réduit la dépense).
   Les virements sont exclus ; une opération sans catégorie compte selon son signe. */
function trCatIds(){return new Set(S.categories.filter(c=>softNorm(c.name)==="TRANSFERT").map(c=>c.id))}
function netSplit(list,keyFn){list=expandSplits(list);const units={},TR=trCatIds();
  list.forEach(t=>{if(t.transferId||TR.has(t.catId))return;const g=keyFn?keyFn(t):"";const k=g+"\u0001"+(t.catId||"tx"+t.id);(units[k]||(units[k]={g,v:0})).v+=t.amount});
  const groups={};let rev=0,dep=0;
  Object.values(units).forEach(u=>{const o=groups[u.g]||(groups[u.g]={rev:0,dep:0});if(u.v>0){o.rev+=u.v;rev+=u.v}else{o.dep-=u.v;dep-=u.v}});
  return{rev,dep,groups}}
const balance=(id,onlyR)=>{const a=accById(id);return (Math.round((a.initial+S.tx.filter(t=>t.accountId===id&&(!onlyR||t.status==="R")).reduce((s,t)=>s+t.amount,0))*100)/100)||0};
const sorted=list=>list.slice().sort((a,b)=>a.date===b.date?0:a.date<b.date?1:-1);

function barChart(m){

  for(let v=0;v<=top+1e-9;v+=step)g+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v>=1000?(v/1000).toLocaleString("fr-FR")+" k":v}</text>`;

    g+=`<rect x="${cx-bw-2}" y="${y(x.rev)}" width="${bw}" height="${y(0)-y(x.rev)}" rx="4" fill="var(--rev)"><title>Revenus ${fmt(x.rev)}</title></rect>`;
    g+=`<rect x="${cx+2}" y="${y(x.dep)}" width="${bw}" height="${y(0)-y(x.dep)}" rx="4" fill="var(--dep)"><title>Dépenses ${fmt(x.dep)}</title></rect>`;

  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenus et dépenses par mois">${g}</svg>`;
}

function logoDarkOf(src){return new Promise(ok=>{const im=new Image();im.onload=()=>{try{const c=document.createElement("canvas");c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext("2d");x.drawImage(im,0,0);

  let changed=0;while(q.length){const i=q.pop(),X=i%W,Y=(i/W)|0;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=X+dx,ny=Y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const j=ny*W+nx;if(seen[j])continue;seen[j]=1;if(dark(j)){const l=L(j),t=sat(j)<40?Math.min(1,Math.max(0,(255-l)/255)):1,k=1-t;d[j*4]=Math.round(232*t+d[j*4]*k);d[j*4+1]=Math.round(236*t+d[j*4+1]*k);d[j*4+2]=Math.round(245*t+d[j*4+2]*k);if(sat(j)<40){const v=Math.round(255-l*0.9);d[j*4]=Math.min(232,v);d[j*4+1]=Math.min(236,v);d[j*4+2]=Math.min(245,v+4)}changed++;q.push(j)}}}

function repRange(){
  const n=new Date(),Y=n.getFullYear(),M=n.getMonth(),span=(a,b,L)=>({from:iso(a),to:iso(b),L});let r;
  switch(rep.period){
    case"m0":r=span(new Date(Y,M,1),new Date(Y,M+1,0),1);break;
    case"m1":r=span(new Date(Y,M-1,1),new Date(Y,M,0),1);break;
    case"3m":r=span(new Date(Y,M-2,1),new Date(Y,M+1,0),3);break;
    case"6m":r=span(new Date(Y,M-5,1),new Date(Y,M+1,0),6);break;
    case"12m":r=span(new Date(Y,M-11,1),new Date(Y,M+1,0),12);break;
    case"y0":r=span(new Date(Y,0,1),new Date(Y,11,31),12);break;
    case"y1":r=span(new Date(Y-1,0,1),new Date(Y-1,11,31),12);break;
    default:{const f=rep.from||`${Y}-01-01`,t=rep.to||today();r={from:f<=t?f:t,to:f<=t?t:f,L:0}}}
  if(r.L){const [y,m]=r.from.split("-").map(Number);r.pfrom=iso(new Date(y,m-1-r.L,1));r.pto=iso(new Date(y,m-1,0))}
  else{const a=new Date(r.from+"T12:00"),b=new Date(r.to+"T12:00"),days=Math.round((b-a)/864e5)+1;r.pfrom=iso(new Date(a.getTime()-days*864e5));r.pto=iso(new Date(a.getTime()-864e5))}
  return r}

const JSPDF_URL="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js";
function loadScript(src){return new Promise((ok,ko)=>{if(window.jspdf)return ok();const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
function pdfData(){
  const {r,e,tot,ptot,b,gran,rows}=repData();const net=tot.rev-tot.dep,pnet=ptot.rev-ptot.dep,rate=tot.rev>0?net/tot.rev*100:null;

    return{sub:`${v>=0?"+":"-"}${Math.abs(v).toLocaleString("fr-FR",{maximumFractionDigits:0})} % vs période précédente`,subColor:Math.abs(v)<0.5?null:(up?v>0:v<0)?POS:NEG}};
  const names=(mode,arr,f)=>mode==="all"?"Tous":arr.length?arr.map(f).join(", "):"Aucune sélection";
  const filters=[["Période",`${PERIODS.find(p=>p[0]===rep.period)[1]} (du ${fdate(r.from)} au ${fdate(r.to)})`],

    table={title:"Opérations",head:["Date","Tiers","Catégorie","Compte","Montant"],widths:[.12,.3,.28,.16,.14],align:["left","left","left","left","right"],
      body:l.map(t=>[fdate(t.date),t.payee,catLabel(t),accById(t.accountId)?.name||"",sg(t.amount)]),colors:l.map(t=>[0,0,0,0,t.amount<0?NEG:POS]),

  return{from:r.from,to:r.to,period:`Du ${fdate(r.from)} au ${fdate(r.to)}`,generated:new Date().toLocaleString("fr-FR",{dateStyle:"long",timeStyle:"short"}),filters,kpis,
    evo:{subtitle:`Du ${fdate(e.from)} au ${fdate(e.to)} · ${gran==="year"?"par année":"par mois"}`,buckets:b},table,
    note:"Les virements entre comptes ne sont pas comptés. Les remboursements classés dans leur catégorie d'origine viennent en déduction des dépenses."}}
function buildPdf(jsPDF,d){
  const doc=new jsPDF({unit:"mm",format:"a4"}),W=210,H=297,M=15,CW=W-2*M,T=s=>String(s??"").replace(/[   ]/g," ");
  const ACC=[11,110,90],DEP=[208,125,99],INK=[19,32,28],MUT=[90,107,101],LINE=[214,223,219],SOFT=[236,241,239];
  const font=(st,sz,col)=>{doc.setFont("helvetica",st);doc.setFontSize(sz);doc.setTextColor(...col)};
  // en-tête
  doc.setFillColor(...ACC);doc.rect(0,0,W,30,"F");
  font("bold",18,[255,255,255]);doc.text("PognonPILOT",M,14);
  font("normal",10,[255,255,255]);doc.text("Rapport financier",M,21);
  font("bold",11,[255,255,255]);doc.text(T(d.period),W-M,14,{align:"right"});
  font("normal",8,[255,255,255]);doc.text(T("Édité le "+d.generated),W-M,21,{align:"right"});
  let y=39;
  // filtres
  d.filters.forEach(([k,v])=>{font("bold",7.5,MUT);doc.text(T(k.toUpperCase()),M,y);font("normal",8.5,INK);const ls=doc.splitTextToSize(T(v),CW-28);doc.text(ls,M+28,y);y+=4.4*ls.length});
  y+=4;
  // indicateurs
  const gap=4,bw=(CW-3*gap)/4,bh=25;
  d.kpis.forEach((k,i)=>{const x=M+i*(bw+gap);doc.setFillColor(...SOFT);doc.roundedRect(x,y,bw,bh,2.5,2.5,"F");
    font("bold",7,MUT);doc.text(T(k.label.toUpperCase()),x+4,y+6.5);
    font("bold",13,k.color||INK);doc.text(T(k.value),x+4,y+14.5);
    font("normal",6.8,k.subColor||MUT);doc.text(doc.splitTextToSize(T(k.sub),bw-8),x+4,y+19.5)});
  y+=bh+11;
  // graphique
  font("bold",12,INK);doc.text("Évolution",M,y);font("normal",8,MUT);doc.text(T(d.evo.subtitle),M,y+5);
  let lx=W-M;[["Dépenses",DEP],["Revenus",ACC]].forEach(([l,c])=>{font("normal",8,MUT);lx-=doc.getTextWidth(l);doc.text(l,lx,y);lx-=4.5;doc.setFillColor(...c);doc.rect(lx,y-2.7,3,3,"F");lx-=7});
  const b=d.evo.buckets,top=y+11,bot=top+52,L=M+16,R=W-M;
  const max=Math.max(1,...b.flatMap(x=>[x.rev,x.dep])),step=niceStep(max/4),tp=Math.ceil(max/step)*step,Y=v=>bot-(bot-top)*v/tp;
  doc.setLineWidth(0.2);doc.setDrawColor(...LINE);
  for(let v=0;v<=tp+1e-9;v+=step){doc.line(L,Y(v),R,Y(v));font("normal",7,MUT);doc.text(T(v>=1000?(v/1000).toLocaleString("fr-FR")+" k€":v+" €"),L-2,Y(v)+1,{align:"right"})}
  const gw=(R-L)/b.length,bar=Math.min(7,gw/3);
  b.forEach((x,i)=>{const cx=L+gw*i+gw/2;
    if(x.rev>0){doc.setFillColor(...ACC);doc.rect(cx-bar-0.4,Y(x.rev),bar,bot-Y(x.rev),"F")}
    if(x.dep>0){doc.setFillColor(...DEP);doc.rect(cx+0.4,Y(x.dep),bar,bot-Y(x.dep),"F")}
    font("normal",b.length>14?5.5:7,MUT);doc.text(T(x.label),cx,bot+4.5,{align:"center"})});
  y=bot+15;
  // tableau
  const t=d.table,cols=t.widths.map(w=>w*CW),rh=6.6,limit=H-20;
  const fit=(s,w)=>{s=T(s);if(doc.getTextWidth(s)<=w)return s;while(s.length>1&&doc.getTextWidth(s+"…")>w)s=s.slice(0,-1);return s+"…"};
  const row=(cells,yy,st,colors)=>{let x=M;cells.forEach((c,i)=>{const w=cols[i];font(st.bold?"bold":"normal",st.size,(colors&&colors[i])||st.col);
      const s=fit(c,w-5);t.align[i]==="right"?doc.text(s,x+w-2.5,yy+4.4,{align:"right"}):doc.text(s,x+2.5,yy+4.4);x+=w})};
  const head=()=>{doc.setFillColor(...SOFT);doc.rect(M,y,CW,rh,"F");row(t.head.map(h=>h.toUpperCase()),y,{bold:1,size:7,col:MUT});y+=rh};
  if(y+rh*3>limit){doc.addPage();y=20}
  font("bold",12,INK);doc.text(T(t.title),M,y);y+=4;head();
  t.body.forEach((cells,i)=>{if(y+rh>limit){doc.addPage();y=20;head()}
    row(cells,y,{size:8.5,col:INK},t.colors[i]);doc.setDrawColor(...LINE);doc.line(M,y+rh,M+CW,y+rh);y+=rh});
  if(t.foot){if(y+rh>limit){doc.addPage();y=20}doc.setFillColor(...SOFT);doc.rect(M,y,CW,rh,"F");row(t.foot,y,{bold:1,size:8.5,col:INK});y+=rh}
  y+=7;if(y>limit-8){doc.addPage();y=20}
  font("normal",7.5,MUT);doc.text(doc.splitTextToSize(T(d.note),CW),M,y);
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);font("normal",7.5,MUT);doc.text("PognonPILOT",M,H-8);doc.text(`Page ${i} / ${n}`,W-M,H-8,{align:"right"})}
  return doc}
async function exportPdf(){
  try{await loadScript(JSPDF_URL)}catch(e){}
  if(!window.jspdf||!window.jspdf.jsPDF){toast("Le module PDF n'a pas pu se charger. Vérifie ta connexion.");return}
  const d=pdfData();let blob;
  try{blob=buildPdf(window.jspdf.jsPDF,d).output("blob")}catch(e){toast("La création du PDF a échoué.");return}
  if(await offerFile(`pognonpilot-rapport-${d.from}-au-${d.to}.pdf`,blob,"application/pdf"))toast("Rapport PDF prêt");

function splitEditor(host,init,getTotal){let rows=(init&&init.length?init:[{catKey:"",amount:0},{catKey:"",amount:0}]).map(r=>({...r}));

function confirmSheet(title,text,okLabel,onOk){openSheet(`<h2>${esc(title)}</h2><p style="color:var(--muted);margin:0">${esc(text)}</p><div class="actions"><div class="row"><button class="btn" data-close>Annuler</button><button class="btn primary" id="okc">${esc(okLabel)}</button></div></div>`);document.getElementById("okc").onclick=()=>{closeSheet();onOk()}}
function toastUndo(msg,undo){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.innerHTML=`<span>${esc(msg)}</span><button type="button" class="toastbtn">Annuler</button>`;document.body.appendChild(t);const tm=setTimeout(()=>t.remove(),7000);t.querySelector("button").onclick=()=>{clearTimeout(tm);t.remove();undo()}}
function regAllR(){const ids=new Set(regIds);const sel=S.tx.filter(t=>ids.has(t.id));if(!sel.length)return;const tids=new Set(sel.filter(t=>t.transferId).map(t=>t.transferId));
  const aff=S.tx.filter(t=>ids.has(t.id)||(t.transferId&&tids.has(t.transferId)));const toR=!sel.every(t=>t.status==="R"),n=sel.length,a=regAcc!=="all"?accById(regAcc):null;
  const where=(a?a.name:"tous les comptes")+(regQ.trim()?` (recherche « ${regQ.trim()} »)`:regF!=="all"?" (filtre en cours)":"");
  confirmSheet(toR?`Rapprocher ${n} opération${n>1?"s":""} ?`:`Retirer le R de ${n} opération${n>1?"s":""} ?`,`Les ${n} opération${n>1?"s":""} affichée${n>1?"s":""} de ${where} seront ${toR?"marquées R":"remises en non rapprochées"}. Pour les virements, l'autre côté suit.`,toR?"Rapprocher":"Retirer le R",()=>{
    const prev=new Map(aff.map(t=>[t.id,t.status]));aff.forEach(t=>t.status=toR?"R":"");commit();
    toastUndo(`${n} opération${n>1?"s":""} ${toR?"rapprochée"+(n>1?"s":""):": R retiré"}`,()=>{S.tx.forEach(t=>{if(prev.has(t.id))t.status=prev.get(t.id)});commit();toast("Modification annulée")})})}
function toast(msg){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}

function catOptions(kind,sel){return S.categories.map(c=>`<optgroup label="${esc(c.name)}"><option value="${c.id}|" ${sel===c.id+"|"?"selected":""}>${esc(c.name)} (général)</option>${c.subs.map(s=>`<option value="${c.id}|${s.id}" ${sel===c.id+"|"+s.id?"selected":""}>${esc(c.name)} › ${esc(s.name)}</option>`).join("")}</optgroup>`).join("")}

function txSheet(id,presetMode,pre){
  const t=id?S.tx.find(x=>x.id===id):null;const tv=t||pre||null;let splitInit=splitInitOf(tv),spEd=null;recPending=pre&&pre.recId||null;

  const draw=()=>{

    <div class="seg" role="group"><button type="button" data-mode="dep" aria-pressed="${mode==="dep"}">${pillIco("down")}Dépense</button><button type="button" data-mode="rev" aria-pressed="${mode==="rev"}">${pillIco("up")}Revenu</button><button type="button" data-mode="vir" aria-pressed="${isV}">${pillIco("transfer")}Virement</button></div>

     <div class="field"><label for="f-acc">${isV?"Depuis le compte":"Compte"}</label><select class="inp" id="f-acc">${accOptions(base?base.accountId:defAcc)}</select></div>

     ${isV?`<div class="field"><label for="f-date">Date</label><input class="inp" type="date" id="f-date" value="${base?base.date:today()}" required></div>`:`<div class="field"><label for="f-payee">Tiers</label><input class="inp" id="f-payee" autocomplete="off" value="${esc(tv?tv.payee:"")}" placeholder="Choisis ou saisis un tiers" required></div>`}

      document.getElementById("f-amt").addEventListener("input",()=>{if(spEd)spEd.refresh()})}
    const pf=document.getElementById("f-payee"),fcEl=document.getElementById("f-cat");attachPayeePicker(pf);
    const fm=document.getElementById("f-mode"),syncChq=()=>{document.getElementById("chqField").hidden=fm.value!=="Chèque"};fm.addEventListener("change",syncChq);
    if(pf&&fm)pf.addEventListener("input",()=>{if(fm.value)return;const m=payeeDefaultMode(pf.value.trim());if(m){fm.value=m;syncChq();fm.classList.add("prefill");setTimeout(()=>fm.classList.remove("prefill"),900)}});let autoCat=!tv;
    if(pf&&fcEl){fcEl.addEventListener("change",()=>{autoCat=false});pf.addEventListener("input",()=>{if(!autoCat&&fcEl.value)return;const k=payeeDefaultCat(pf.value.trim());

      const dv=t?(t.doubt||pair?.doubt||""):"",chq=pm==="Chèque"?document.getElementById("f-chq").value.trim():"",dvo={...(dv?{doubt:dv}:{}),...(chq?{chq}:{})};

        S.tx.push({id:uid(),accountId:dest,date,payee:`Virement depuis ${A}`,amount:amt,transferId:tid,status:st,note,mode:pm,...dvo});

        S.tx.push({id:t?t.id:uid(),accountId:acc,date,payee:pn,amount:mode==="dep"?-amt:amt,catId:parts?null:(catId||null),subId:parts?null:(subId||null),...(parts?{splits:parts}:{}),status:st,note,mode:pm,...dvo});
      }
      const wasRec=recPending;if(wasRec)advanceRec(wasRec);
      closeSheet();commit();toast(t?"Opération modifiée":wasRec?"Échéance saisie, la suivante est programmée":"Opération ajoutée");
    };
    const okd=document.getElementById("okDoubt");if(okd)okd.onclick=()=>{delete t.doubt;if(pair)delete pair.doubt;commit();document.getElementById("vban").remove();toast("Opération marquée comme vérifiée")};
    document.getElementById("saveTx").onclick=save;
    document.getElementById("txf").onsubmit=e=>{e.preventDefault();save()};
    const mk=document.getElementById("mkRec");if(mk)mk.onclick=()=>recSheet(null,{label:t.payee,payee:t.payee,amount:t.amount,accountId:t.accountId,catId:t.catId,subId:t.subId,freq:"M",next:addFreq(t.date,"M"),note:t.note,mode:t.mode||"",splits:isSplit(t)?t.splits.map(x=>({...x})):null});
    const del=document.getElementById("delTx");if(del)del.onclick=()=>confirmSheet("Supprimer l'opération ?",t.transferId?"Les deux côtés du virement seront supprimés.":"Cette opération sera retirée du registre.","Supprimer",()=>{S.tx=S.tx.filter(x=>x.id!==t.id&&!(t.transferId&&x.transferId===t.transferId));commit();toast("Opération supprimée")});
  };
  if(!S.accounts.length){toast("Crée d'abord un compte.");return}
  draw();
}

/* ---------- import ---------- */
function parseAmount(v){if(typeof v==="number")return v;let s=String(v??"").replace(/[\s €]/g,"");if(!s)return NaN;
  if(s.includes(",")&&s.includes("."))s=s.lastIndexOf(",")>s.lastIndexOf(".")?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"");else s=s.replace(",",".");return parseFloat(s)}
function parseDate(v){if(v==null||v==="")return null;
  if(typeof v==="number"){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}
  if(v instanceof Date)return iso(v);
  const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;return`${y}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[1]}-${m[2]}-${m[3]}`:null}
function parseCSV(text){text=text.replace(/^﻿/,"");const first=text.split(/\r?\n/)[0]||"";const sep=[";","\t",","].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[];let row=[],cell="",q=false;for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;else if(c===sep){row.push(cell);cell=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}else cell+=c}
  if(cell||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()!==""))}


/* ---------- import Money Manager Ex (export .json) : ajoute des opérations, ne touche pas au solde de départ ---------- */
const keyNorm=x=>norm(x).replace(/[^A-Z0-9]+/g," ").trim();
const softNorm=x=>keyNorm(x).split(" ").map(w=>w.replace(/S$/,"")).join(" ");
function lev(a,b){const m=a.length,n=b.length;if(!m||!n)return m||n;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function nearSub(c,sn){const k=x=>softNorm(x).replace(/[^A-Z0-9]/g,"");const t=k(sn);let best=null,bs=0;c.subs.forEach(x=>{const u=k(x.name);if(!t||!u)return;const r=1-lev(t,u)/Math.max(t.length,u.length);if(r>bs){bs=r;best=x}});return bs>=.75?best:null}
function mmexCatKey(name){if(!name)return"";const [pn,sn]=String(name).split(":");const c=S.categories.find(x=>softNorm(x.name)===softNorm(pn));if(!c)return"";
  if(!sn)return c.id+"|";const sb=c.subs.find(x=>softNorm(x.name)===softNorm(sn))||nearSub(c,sn);return sb?`${c.id}|${sb.id}`:c.id+"|"}
function mmexSheet(d){
  const cats=Object.fromEntries((d.CATEGORIES||[]).map(c=>[c.ID,c.NAME])),pays=Object.fromEntries((d.PAYEES||[]).map(x=>[x.ID,x.NAME])),accs=Object.fromEntries((d.ACCOUNTS||[]).map(a=>[a.ID,a]));
  const src=(d.transactions||[]).filter(t=>!t.DELETEDTIME);if(!src.length){toast("Ce fichier Money Manager Ex ne contient aucune opération.");return}
  const hits={};src.forEach(t=>{hits[t.ACCOUNTID]=(hits[t.ACCOUNTID]||0)+1;if(t.TOACCOUNTID>0)hits[t.TOACCOUNTID]=(hits[t.TOACCOUNTID]||0)+1});
  const L=S.mmexMap||(S.mmexMap={acc:{},pay:{},payAcc:{},upay:{}});["acc","pay","payAcc","upay"].forEach(k=>L[k]=L[k]||{});
  const alnum=n=>!!n&&/[A-Za-z0-9]/.test(n);Object.entries(pays).forEach(([id,n])=>{if(alnum(n))L.pay[id]=n});
  const payName=id=>alnum(pays[id])?pays[id]:L.pay[id]||"";

      const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""})}}

      if(c.amt!=="")amount=parseAmount(r[c.amt]);else{const d=parseAmount(r[c.deb]),k=parseAmount(r[c.cred]);amount=(isNaN(k)?0:Math.abs(k))-(isNaN(d)?0:Math.abs(d));if(isNaN(d)&&isNaN(k))amount=NaN}
      return{date,payee:c.payee!==""?String(r[c.payee]).trim():"",amount,cat:c.cat!==""?String(r[c.cat]).trim():"",sub:c.sub!==""?String(r[c.sub]).trim():"",mode:c.mode!==""?String(r[c.mode]).trim():""}}).filter(x=>x.date&&!isNaN(x.amount)&&x.amount!==0)};

}

/* ---------- export / sauvegarde ---------- */
async function offerFile(filename,data,mime){
  try{const dl=window.claude&&await window.claude.use("downloads");
    if(dl){await dl.save({filename,data});return true}}
  catch(e){if(e&&e.code==="declined")return false;if(e&&e.code&&!["unavailable","not_granted","capability_disabled","capability_removed"].includes(e.code)){toast("L'enregistrement n'a pas abouti.");return false}}
  const blob=data instanceof Blob?data:new Blob([data],{type:mime});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true;
}
function exportRows(){return expandSplits(sorted(S.tx)).map(t=>{const c=S.categories.find(c=>c.id===t.catId),s=c?.subs.find(s=>s.id===t.subId);
  return{Date:fdate(t.date),Compte:accById(t.accountId)?.name||"",Tiers:t.payee,Catégorie:t.transferId?"Virement":(c?.name||""),"Sous-catégorie":s?.name||"",Montant:t.amount,"Mode de paiement":t.mode||"","N° de chèque":t.chq||"",Ventilation:t._part?`Part ${t._part}/${t._of}`:"",Statut:t.status==="R"?"R":"",Note:t.note||""}})}

      const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
      if(await offerFile(`pognonpilot-rapport-${r.from}-au-${r.to}.xlsx`,new Blob([buf]),"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"))toast("Rapport exporté");break}
    case"newacc":accSheet();break;
    case"homeaccs":homeAccSheet();break;
    case"reset":confirmSheet("Partir d'un fichier vierge ?","Les données d'exemple seront effacées. Tu gardes les catégories proposées et un premier compte courant à renommer.","Effacer l'exemple",()=>{S=blank();dirty=true;cache();view="acc";render()});break;
    case"save":saveJson();break;
    case"open":openPicked();break;
    case"download":downloadJson();break;
    case"unlink":unlinkFile();break;
    case"reconnect":checkLinked(true);break;
    case"loadnewer":{const f=await fileHandle.getFile();dirty=false;await openJson(f,fileHandle);break}
    case"keepmine":fileState="linked";await saveJson();break;
    case"install":if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice.catch(()=>{});deferredInstall=null;render()}break;
    case"import":if(!S.accounts.length){toast("Crée d'abord un compte.");break}document.getElementById("fileImport").click();break;
    case"csv":{const r=exportRows();if(!r.length){toast("Aucune opération à exporter.");break}const h=Object.keys(r[0]);
      const line=v=>{const s=typeof v==="number"?v.toFixed(2).replace(".",","):String(v);return/[;"\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s};
      const csv="﻿"+[h.join(";"),...r.map(o=>h.map(k=>line(o[k])).join(";"))].join("\r\n");
      if(await offerFile(`pognonpilot-operations-${today()}.csv`,csv,"text/csv"))toast("Export CSV prêt");break}
    case"xlsx":{if(!window.XLSX){toast("Le module Excel n'a pas pu se charger. Utilise l'export CSV.");break}
      const wb=XLSX.utils.book_new();const ws=XLSX.utils.json_to_sheet(exportRows());ws["!cols"]=[{wch:11},{wch:18},{wch:30},{wch:16},{wch:18},{wch:12},{wch:12},{wch:24}];
      XLSX.utils.book_append_sheet(wb,ws,"Opérations");
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.accounts.map(a=>({Compte:a.name,Établissement:a.bank||"",Type:a.type,État:a.closed?"Clôturé":"Actif","Date d'ouverture":a.opened?fdate(a.opened):"","Solde initial":a.initial,Solde:Math.round(balance(a.id)*100)/100,"Solde rapproché":Math.round(balance(a.id,true)*100)/100}))),"Comptes");
      if(S.recurring.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.recurring.map(r=>({Libellé:r.label,Tiers:r.payee||"",Compte:accById(r.accountId)?.name||"",Catégorie:catLabel({catId:r.catId,subId:r.subId}),Montant:r.amount,Fréquence:freqLabel(r.freq),"Mode de paiement":r.mode||"","Prochaine échéance":fdate(r.next),Active:r.active?"Oui":"Non"}))),"Échéancier");
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.categories.flatMap(c=>[{Catégorie:c.name,"Sous-catégorie":""},...c.subs.map(s=>({Catégorie:c.name,"Sous-catégorie":s.name}))])),"Catégories");
      const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
      if(await offerFile(`pognonpilot-${today()}.xlsx`,new Blob([buf]),"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"))toast("Export Excel prêt");break}
  }
});
document.addEventListener("submit",e=>{
  if(e.target.id==="newcat"){e.preventDefault();const n=document.getElementById("nc-name").value.trim();if(!n)return;S.categories.push({id:uid(),name:n,subs:[],...guessIcon(n,S.categories.length)});commit();toast("Catégorie créée");return}
  if(e.target.id==="newpayee"){e.preventDefault();const n=document.getElementById("np-name").value.trim();if(!n)return;if(S.payees.some(p=>p.name.toLowerCase()===n.toLowerCase())){toast("Ce tiers existe déjà.");return}S.payees.push({id:uid(),name:n,type:document.getElementById("np-type").value.trim(),active:true});commit();toast("Tiers ajouté");return}
  if(e.target.dataset.addsub){e.preventDefault();const c=S.categories.find(x=>x.id===e.target.dataset.addsub);const i=document.getElementById("sub-"+c.id);const n=i.value.trim();if(!n)return;c.subs.push({id:uid(),name:n});commit();const ni=document.getElementById("sub-"+c.id);ni&&ni.focus()}
});
document.addEventListener("input",e=>{if(e.target.id==="payq"){payQ=e.target.value;const pos=e.target.selectionStart;renderCat();const n=document.getElementById("payq");if(n){n.focus();n.setSelectionRange(pos,pos)}return}if(e.target.id==="r-payq"){rep.payQ=e.target.value;const pos=e.target.selectionStart;renderRep();const n=document.getElementById("r-payq");if(n){n.focus();n.setSelectionRange(pos,pos)}}});
document.addEventListener("change",e=>{if(e.target.id==="autosave"){autoSave=e.target.checked;try{localStorage.setItem(KEY+".auto",autoSave?"1":"0")}catch(_){}if(autoSave&&dirty)scheduleAutoSave();renderChip();return}if(e.target.id==="reg-acc"){regAcc=e.target.value;renderReg();return}if(e.target.id==="reg-closed"){showClosed=e.target.checked;renderReg();return}const k={"r-period":"period","r-from":"from","r-to":"to","r-accmode":"accMode","r-catmode":"catMode","r-paymode":"payMode","r-group":"group","r-evomode":"evoMode","r-evofrom":"evoFrom","r-evoto":"evoTo","r-gran":"gran"}[e.target.id];
  if(k){rep[k]=e.target.value;if(["catMode","group"].includes(k))rep.drill=null;renderRep()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal.innerHTML)closeSheet()});
document.getElementById("fab").onclick=()=>txSheet();
document.getElementById("fileJson").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)openJson(f)};
document.getElementById("fileImport").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)handleImport(f)};

load();render();initFile();
</script>
